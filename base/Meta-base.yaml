mode: rule              # 规则模式：rule（规则） / global（全局代理）/ direct（全局直连）/ script (脚本) 
mixed-port: 7890        # 混合端口，HTTP 和 SOCKS5 用一个端口
ipv6: false              # 开启 IPv6 总开关，关闭阻断所有 IPv6 链接和屏蔽 DNS 请求 AAAA 记录
log-level: info         # 设置日志输出级别 (5 个级别：silent / error / warning / info / debug）
tcp-concurrent: true    #【Meta专属】TCP 并发连接所有 IP, 将使用最快握手的 TCP
# 全局 TLS 指纹，优先低于 proxy 内的 client-fingerprint
# 可选： "chrome","firefox","safari","ios","random","none" options.
global-client-fingerprint: chrome
unified-delay: true    # 统一延迟，更换延迟计算方式，去除握手等额外延迟
profile:
  store-selected: true      # 存储 select 选择记录
  store-fake-ip: true       # 持久化 fake-ip

###########################################

allow-lan: false        # 允许局域网的连接（共享代理）
bind-address: "*"       # 监听IP白名单，可绑定单个IPv4和v6地址，"*" 为绑定所有IP地址，仅在将allow-lan设置为true时适用
authentication:         # http,socks入口的验证用户名，密码
  - "user11name:pass22word"
skip-auth-prefixes:     # 设置跳过验证的IP段
  - 127.0.0.1/8
  - ::1/128
  - 192.168.0.0/16

###########################################

#  find-process-mode has 3 values:always, strict, off
#  - always, 开启，强制匹配所有进程
#  - strict, 默认，由 mihomo 判断是否开启
#  - off, 不匹配进程，推荐在路由器上使用此模式
find-process-mode: strict   # 匹配所有进程（always/strict/off）

###########################################

geodata-mode: true          #【Meta专属】使用geoip.dat数据库(默认：false使用mmdb数据库)
geo-auto-update: true      # 是否自动更新 geodata
geo-update-interval: 24     # 更新间隔，单位：小时
# Matcher implementation used by GeoSite, available implementations:
# - succinct (default, same as rule-set)
# - mph (from V2Ray, also `hybrid` in Xray)
geosite-matcher: mph        # geosite 规则匹配器，默认 succinct，mph 更快但占用内存更多
geox-url:                  # 自定义 geodata 下载地址，需要有代理的前提才能下载geoip和geosite
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"     
#  geoip: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
#  geosite: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
#  mmdb: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"

###########################################

external-controller: 127.0.0.1:54233     # 外部控制器监听地址，可以使用 RESTful API 来控制你的 clash 内核
secret: "metacubexd"                     # 外部控制器的密码，默认不设置密码
#external-ui: ui
#external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

###########################################

# TCP keep alive interval
# disable-keep-alive: false #目前在 android 端强制为 true
# keep-alive-idle: 15
keep-alive-interval: 300    # 默认15s    # TCP keep alive interval
clash-for-android:
  append-system-dns: false

###########################################

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-detect-interface: true   # 自动识别出口网卡
  auto-route: true              # 自动设置全局路由，可以自动将全局流量路由进入 tun 网卡
  strict-route: true          # 将所有连接路由到 tun 来防止泄漏，但你的设备将无法其他设备被访问

###########################################

sniffer:                    # 嗅探域名 可选配置
  enable: true
  ## 对 redir-host 类型识别的流量进行强制嗅探
  ## 如：Tun、Redir 和 TProxy 并 DNS 为 redir-host 皆属于
  # force-dns-mapping: false
  ## 对所有未获取到域名的流量进行强制嗅探
  parse-pure-ip: true
  # 是否使用嗅探结果作为实际访问，默认 true
  # 全局配置，优先级低于 sniffer.sniff 实际配置
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:                    # TLS 默认嗅探 443
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - 'Mijia Cloud' # 小米米家服务
    - "+.lan"
    - "+.local"
  
    - '+.apple.com'
    - "+.icloud.com"
    - 'icloud.com' # 部分iCloud服务
    - 'mask.icloud.com' # iCloud Private Relay
    - 'mask-h2.icloud.com'
    - 'ocsp.apple.com' # 苹果证书吊销查询
    - 'ocsp2.apple.com' 
    - 'world-gen.g.aaplimg.com'

    - '*.srv.nintendo.net' # 任天堂服务
    - '*.stun.playstation.net' # PlayStation 网络服务
    - '*.dl.playstation.net' # PlayStation 下载服务
    - 'xbox.*.microsoft.com' # Xbox 相关服务
    - '*.*.xboxlive.com' # Xbox Live 服务
    
  force-domain: []          # 强制对此域名进行嗅探
  
###########################################

dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false               # 是否开启 DOH 的 http/3
  use-hosts: true               # 是否查询系统 hosts
  use-system-hosts: true
  listen: 0.0.0.0:1053            # DNS 监听地址
  ipv6: false                    # IPV6解析开关；如果为false，将返回ipv6结果为空
#  ipv6-timeout: 300 # 单位：ms，内部双栈并发时，向上游查询 AAAA 时，等待 AAAA 的时间，默认 100ms
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16  # fakeip 下的 IP 段设置，tun 网卡的默认 ip 也使用此值
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "localhost.ptlogin2.qq.com"
    
    # Windows 网络检测
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"

    # Apple / iCloud / 推送
    - "+.apple.com"
    - "+.icloud.com"
    - "icloud.com"
    - "mask.icloud.com"
    - "mask-h2.icloud.com"
    - "ocsp.apple.com"
    - "ocsp2.apple.com"
    - "world-gen.g.aaplimg.com"

    # 米家 / 游戏主机
    - "Mijia Cloud"
    - "+.market.xiaomi.com"
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - "*.dl.playstation.net"
    - "xbox.*.microsoft.com"
    - "*.*.xboxlive.com"
  default-nameserver:           # 用于解析 nameserver，fallback 以及其他DNS服务器配置的，DNS 服务域名
    - 223.5.5.5                 # 只能使用纯 IP 地址，可使用加密 DNS
    - 119.29.29.29
    - 114.114.114.114
#    - 192.168.8.1
#    - 192.168.10.1
#    - 8.8.8.8
#    - 1.1.1.1
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
#    - 192.168.8.1
#    - 8.8.8.8
#    - 114.114.114.114
#    - 223.5.5.5
#    - 119.29.29.29
#    - 1.1.1.1
#    - 192.168.10.1
  proxy-server-nameserver:                  # 专用于节点域名解析的 DNS 服务器，非必要配置项            
    - https://dns.alidns.com/dns-query     # 配置服务器若查询失败将使用 nameserver，非并发查询
    - https://doh.pub/dns-query
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:                        # 指定域名查询的解析服务器
    "geosite:cn":
        - https://dns.alidns.com/dns-query
        - https://doh.pub/dns-query
    "geosite:private":
        - 223.5.5.5
        - 119.29.29.29
#    'www.baidu.com': '114.114.114.114'
#    "rule-set:private":
#      - https://doh.pub/dns-query
#      - https://dns.alidns.com/dns-query
#    "rule-set:geolocation-!cn":
#      - "https://dns.cloudflare.com/dns-query#dns"
#      - "https://dns.google/dns-query#dns"
